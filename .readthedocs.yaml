version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "24"
  jobs:
    post_install:
      - npm install --no-save --package-lock=false jsdoc@4.0.5
    build:
      html:
        # sphinx-js requires serial reading.
        - python -m sphinx -W -n -j 1 -b html -D "language=$READTHEDOCS_LANGUAGE" docs "$READTHEDOCS_OUTPUT/html"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
