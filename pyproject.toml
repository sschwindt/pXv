[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pxv"
version = "0.1.0"
description = "Mixed PIV/PTV surface velocimetry for drone and lab top-view video"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sebastian Schwindt" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "pyproj>=3.5",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0", "netCDF4>=1.6", "xarray>=2023.1"]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
opt = ["optuna>=3.4"]
all = ["pxv[geo,gui,opt]"]

[project.scripts]
pxv = "pxv.cli:main"

[tool.setuptools.packages.find]
include = ["pxv*"]
